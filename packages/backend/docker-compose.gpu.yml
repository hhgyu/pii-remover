services:
  opf:
    image: ghcr.io/hhgyu/pii-remover-backend:latest-gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: pii-remover-backend-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPF_DEVICE: cuda
      OPF_HOST: 0.0.0.0
      OPF_PORT: "8000"
      OPF_LOG_LEVEL: info
      PII_PROXY_ENABLED: "${PII_PROXY_ENABLED:-1}"
      # Comma-separated categories the proxy leaves untouched on the wire.
      # Empty = mask everything detected.
      PII_PROXY_EXCLUDED_CATEGORIES: "${PII_PROXY_EXCLUDED_CATEGORIES:-}"
      PII_REMOVER_TOKEN_KEY: "${PII_REMOVER_TOKEN_KEY:-}"
      OPF_IDLE_TIMEOUT_SECONDS: "${OPF_IDLE_TIMEOUT_SECONDS:-1800}"
      OPF_IDLE_CHECK_INTERVAL_SECONDS: "${OPF_IDLE_CHECK_INTERVAL_SECONDS:-60}"
      OPF_BATCH_MAX: "${OPF_BATCH_MAX:-256}"
      OPF_PROFILE: "${OPF_PROFILE:-0}"
      KNER_PROFILE: "${KNER_PROFILE:-0}"
      KNER_PRELOAD: "${KNER_PRELOAD:-1}"
      OPF_VARIANT: "${OPF_VARIANT:-fp32}"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - opf_hf_cache_gpu:/home/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  opf_hf_cache_gpu:
