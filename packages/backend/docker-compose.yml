services:
  opf:
    image: ghcr.io/hhgyu/pii-remover-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-remover-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPF_DEVICE: cpu
      OPF_HOST: 0.0.0.0
      OPF_PORT: "8000"
      OPF_LOG_LEVEL: info
      PII_PROXY_ENABLED: "${PII_PROXY_ENABLED:-1}"
      # Must match the host-side hook's key, or neither side can restore the
      # other's tokens. Unset = fresh key per start, nothing survives a restart.
      PII_REMOVER_TOKEN_KEY: "${PII_REMOVER_TOKEN_KEY:-}"
      OPF_IDLE_TIMEOUT_SECONDS: "${OPF_IDLE_TIMEOUT_SECONDS:-1800}"
      OPF_IDLE_CHECK_INTERVAL_SECONDS: "${OPF_IDLE_CHECK_INTERVAL_SECONDS:-60}"
      OPF_BATCH_MAX: "${OPF_BATCH_MAX:-256}"
      OPF_PROFILE: "${OPF_PROFILE:-0}"
      KNER_PROFILE: "${KNER_PROFILE:-0}"
      KNER_PRELOAD: "${KNER_PRELOAD:-0}"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - opf_hf_cache:/home/app/.cache/huggingface

volumes:
  opf_hf_cache:
