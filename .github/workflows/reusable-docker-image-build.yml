name: _docker-image-build (reusable)

on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
        description: "Image variant label used in cache scope, suffix, and tags (cpu/slim/gpu)."
      dockerfile:
        type: string
        required: true
        description: "Path to the Dockerfile relative to the build context."
      suffix:
        type: string
        required: false
        default: ""
        description: 'Image tag suffix (e.g. "-slim", "-gpu"). Empty string for the default variant.'
      platforms:
        type: string
        required: true
        description: "Comma-separated buildx platforms (e.g. linux/amd64,linux/arm64)."
      use-qemu:
        type: boolean
        required: false
        default: false
        description: "Set up QEMU for cross-platform builds (needed for arm64 on amd64 runners)."
      require-main-or-tag:
        type: boolean
        required: false
        default: false
        description: "Skip the build unless the ref is a v* tag or the main branch."
      context:
        type: string
        required: false
        default: "packages/backend"
        description: "Build context path."
      image-name:
        type: string
        required: true
        description: 'Full image name without registry (e.g. "owner/pii-remover-backend").'
      registry:
        type: string
        required: false
        default: "ghcr.io"
        description: "Container registry hostname."

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    if: >-
      ${{ !inputs.require-main-or-tag
          || startsWith(github.ref, 'refs/tags/v')
          || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: inputs.use-qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          flavor: |
            suffix=${{ inputs.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ inputs.variant }}
          cache-to: type=gha,scope=backend-${{ inputs.variant }},mode=max
          provenance: false
