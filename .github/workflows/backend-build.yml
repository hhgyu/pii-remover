name: backend-build

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-build.yml"
      - ".github/workflows/reusable-docker-image-build.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-build.yml"
      - ".github/workflows/reusable-docker-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/backend/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy server

      - name: Run tests
        run: pytest -q

  build-image:
    name: ${{ matrix.variant }}
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: Dockerfile
            suffix: ""
            platforms: linux/amd64,linux/arm64
            use-qemu: true
            cache-hf-weights: true
            require-main-or-tag: false
          - variant: slim
            dockerfile: Dockerfile.slim
            suffix: "-slim"
            platforms: linux/amd64,linux/arm64
            use-qemu: true
            cache-hf-weights: true
            require-main-or-tag: false
          - variant: gpu
            dockerfile: Dockerfile.gpu
            suffix: "-gpu"
            platforms: linux/amd64
            use-qemu: false
            cache-hf-weights: false
            require-main-or-tag: true
    uses: ./.github/workflows/reusable-docker-image-build.yml
    with:
      variant: ${{ matrix.variant }}
      dockerfile: ${{ matrix.dockerfile }}
      suffix: ${{ matrix.suffix }}
      platforms: ${{ matrix.platforms }}
      use-qemu: ${{ matrix.use-qemu }}
      cache-hf-weights: ${{ matrix.cache-hf-weights }}
      require-main-or-tag: ${{ matrix.require-main-or-tag }}
      image-name: ${{ github.repository_owner }}/pii-remover-backend
