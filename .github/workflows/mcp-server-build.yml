name: mcp-server-build

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - "packages/core/**"
      - ".github/workflows/mcp-server-build.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - "packages/core/**"
      - ".github/workflows/mcp-server-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-server-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (workspace)
        run: bun run typecheck

      - name: Test
        run: bun test packages/mcp-server/tests/ packages/core/tests/

  compile:
    name: compile (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            artifact: pii-remover-mcp-linux-x64
          - target: darwin-arm64
            runner: macos-latest
            artifact: pii-remover-mcp-darwin-arm64
          - target: darwin-x64
            runner: macos-13
            artifact: pii-remover-mcp-darwin-x64
          - target: windows-x64
            runner: windows-latest
            artifact: pii-remover-mcp-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run build:core

      - name: Compile single binary
        working-directory: packages/mcp-server
        run: bun run compile:${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/mcp-server/compiled/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to release
    runs-on: ubuntu-latest
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pii-remover-mcp-linux-x64/pii-remover-mcp-linux-x64
            dist/pii-remover-mcp-darwin-arm64/pii-remover-mcp-darwin-arm64
            dist/pii-remover-mcp-darwin-x64/pii-remover-mcp-darwin-x64
            dist/pii-remover-mcp-windows-x64.exe/pii-remover-mcp-windows-x64.exe
          fail_on_unmatched_files: true
